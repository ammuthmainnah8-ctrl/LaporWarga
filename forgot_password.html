
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lupa Password - LaporWarga</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            background: white;
            width: 100%;
            max-width: 420px;
            padding: 32px;
            border-radius: 14px;
            box-shadow: 0 8px 30px rgba(0,0,0,.08);
        }

        h2 {
            color: #1e293b;
            margin-top: 0;
        }

        p {
            color: #64748b;
            line-height: 1.6;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #334155;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
            margin-bottom: 18px;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
        }

        button:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        #result {
            margin-top: 18px;
            padding: 12px;
            border-radius: 8px;
            display: none;
            overflow-wrap: anywhere;
        }

        .success {
            display: block !important;
            background: #dcfce7;
            color: #166534;
        }

        .error {
            display: block !important;
            background: #fee2e2;
            color: #991b1b;
        }

        a {
            color: #2563eb;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Lupa Password?</h2>

        <p>
            Masukkan email yang terdaftar pada akun LaporWarga.
            Kami akan mengirimkan tautan untuk mengatur ulang password.
        </p>

        <form id="forgotForm">
            <label for="email">Alamat Email</label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Masukkan email terdaftar"
                required
            >

            <button type="submit" id="submitBtn">
                Kirim Tautan Reset
            </button>
        </form>

        <div id="result" role="status" aria-live="polite"></div>

        <p>
            <a href="index.html">Kembali ke halaman utama</a>
        </p>
    </div>

    <script>
        const form = document.getElementById('forgotForm');
        const result = document.getElementById('result');
        const button = document.getElementById('submitBtn');

        form.addEventListener('submit', async function(event) {
            event.preventDefault();

            result.className = '';
            result.style.display = 'none';
            result.textContent = '';

            button.disabled = true;
            button.textContent = 'Mengirim...';

            try {
                const formData = new FormData(form);

                const response = await fetch(
                    'backend/auth/request_password_reset.php',
                    {
                        method: 'POST',
                        body: formData,
                        credentials: 'same-origin'
                    }
                );

                const data = await response.json();

                if (!response.ok || !data.success) {
                    throw new Error(data.message || 'Permintaan gagal.');
                }

                result.className = 'success';
                result.textContent = data.message;

                form.reset();

            } catch (error) {
                result.className = 'error';
                result.textContent = error.message;
            } finally {
                button.disabled = false;
                button.textContent = 'Kirim Tautan Reset';
            }
        });
    </script>

</body>
</html>
