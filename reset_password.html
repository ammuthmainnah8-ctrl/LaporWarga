
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - LaporWarga</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f1f5f9;
            padding: 20px;
        }

        .container {
            background: white;
            width: 100%;
            max-width: 420px;
            padding: 35px;
            border-radius: 14px;
            box-shadow: 0 8px 30px rgba(0,0,0,.08);
        }

        h2 {
            text-align: center;
            color: #1e293b;
            margin-bottom: 10px;
        }

        p {
            text-align: center;
            color: #64748b;
            font-size: 14px;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin: 15px 0 7px;
            color: #334155;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            outline: none;
        }

        input:focus {
            border-color: #2563eb;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 22px;
            border: none;
            border-radius: 7px;
            background: #2563eb;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        button:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        #message {
            margin-top: 18px;
            text-align: center;
            font-size: 14px;
            line-height: 1.5;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Reset Password</h2>
    <p>Buat password baru untuk akun LaporWarga Anda.</p>

    <form id="resetForm">
        <label for="password">Password Baru</label>
        <input
            type="password"
            id="password"
            name="password"
            minlength="8"
            required
            placeholder="Minimal 8 karakter"
        >

        <label for="confirmPassword">Konfirmasi Password</label>
        <input
            type="password"
            id="confirmPassword"
            name="confirm_password"
            minlength="8"
            required
            placeholder="Masukkan ulang password"
        >

        <button type="submit" id="submitButton">
            Simpan Password Baru
        </button>
    </form>

    <div id="message" role="status"></div>
</div>

<script>
const form = document.getElementById('resetForm');
const message = document.getElementById('message');
const button = document.getElementById('submitButton');

form.addEventListener('submit', async function(event) {
    event.preventDefault();

    const token = new URLSearchParams(
        window.location.search
    ).get('token');

    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirmPassword').value;

    if (!token) {
        message.style.color = 'red';
        message.textContent = 'Token reset tidak ditemukan.';
        return;
    }

    if (password.length < 8) {
        message.style.color = 'red';
        message.textContent = 'Password minimal 8 karakter.';
        return;
    }

    if (password !== confirmPassword) {
        message.style.color = 'red';
        message.textContent = 'Konfirmasi password tidak cocok.';
        return;
    }

    const formData = new FormData();
    formData.append('token', token);
    formData.append('password', password);
    formData.append('confirm_password', confirmPassword);

    button.disabled = true;
    button.textContent = 'Memproses...';

    try {
        const response = await fetch(
            'backend/auth/reset_password.php',
            {
                method: 'POST',
                body: formData
            }
        );

        const result = await response.json();

        message.style.color = result.success ? 'green' : 'red';
        message.textContent = result.message;

        if (result.success) {
            form.reset();
        }

    } catch (error) {
        message.style.color = 'red';
        message.textContent = 'Terjadi kesalahan koneksi server.';
    } finally {
        button.disabled = false;
        button.textContent = 'Simpan Password Baru';
    }
});
</script>

</body>
</html>
